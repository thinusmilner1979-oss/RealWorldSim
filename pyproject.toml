[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "realworldsim"
version = "0.1.0"
description = "An open-source world model: a probabilistic simulator of the global economy and geopolitics, seeded from real data."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "RealWorldSim contributors"}]
keywords = ["simulation", "economics", "geopolitics", "world-model", "agent-based"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.26",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.4"]
desktop = ["pywebview>=5"]
ml = ["torch>=2.2"]

[project.scripts]
rws = "realworldsim.cli:main"

[project.urls]
Homepage = "https://github.com/thinusmilner1979-oss/RealWorldSim"
Issues = "https://github.com/thinusmilner1979-oss/RealWorldSim/issues"

[tool.setuptools.packages.find]
include = ["realworldsim*"]

[tool.setuptools.package-data]
realworldsim = ["data/*.json", "data/*.geojson", "server/static/*", "server/static/vendor/*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
